# SAR Image Enhancement Configuration ---------------------------------------------------------
# Enable SAR (Synthetic Aperture Radar) image three-channel physical enhancement
# This converts single-channel SAR images to three-channel RGB using:
# - R: Scattering Keypoint Heatmap (Harris corner detection)
# - G: Structure Tensor Coherence Map (anisotropy analysis)
# - B: Adaptive Log-Amplitude Map (dynamic range compression)
sar_enhancement: true             # Enable SAR enhancement (true/false)
sar_sigma_keypoint: 1.5            # Gaussian diffusion radius for keypoint heatmap (R channel)
sar_sigma_tensor: 1.5              # Smoothing scale for structure tensor (G channel)
sar_clip_ratio: 2   
