# YOLO12-obb Oriented Bounding Boxes (OBB) model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/obb

# Parameters
nc: 12 # number of classes
stem_mode: dual  # dual=DualStreamStem(物理先验引导), conv=原生Conv
prior_fusion: false  # false: 先验已由DualStreamStem在入口处融合，不再需要prior_branch

scales: # model compound scaling constants, i.e. 'model=yolo12n-obb.yaml' will call yolo12-obb.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024] # summary: 287 layers, 9,570,275 parameters, 9,570,259 gradients, 22.7 GFLOPs

# YOLOv12 改进版 —— backbone
backbone:
  - [-1, 1, DualStreamStem, [64, 3, 2]]     # 创新点1
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]       # 低层特征保持 C3k2
  - [-1, 1, Conv, [512, 3, 2]]
  # P4/16 层：rot=True → 内部使用 RotatedAdaptive_Bottleneck
  - [-1, 4, A2C2f, [512, True, 4, False, 2.0, 0.5, 1, True, True]] # a2=True, area=4, residual=False, mlp=2.0, e=0.5, g=1, shortcut=True, rot=True
  - [-1, 1, Conv, [1024, 3, 2]]
  # P5/32 层：rot=True → 内部使用 RotatedAdaptive_Bottleneck
  - [-1, 4, A2C2f, [1024, True, 1, False, 2.0, 0.5, 1, True, True]] # a2=True, area=1, residual=False, mlp=2.0, e=0.5, g=1, shortcut=True, rot=True

# YOLO12n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, OBB, [nc, 1]] # Detect(P3, P4, P5)
